sonar.organization=swnt-tracop
sonar.projectKey=SWNT-Tracop_Tracop-app
sonar.sources=apps/api/src,packages/contracts/src
sonar.tests=apps/api/test,packages/contracts/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/*fixture*/**,apps/api/drizzle/**,apps/api/src/modules/**/index.ts,**/*.spec.ts,**/*.test.ts
sonar.test.inclusions=apps/api/test/**/*.ts,packages/contracts/test/**/*.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,packages/contracts/coverage/lcov.info
# La cobertura de Jest se mide sobre dominio, aplicación, kernel y app.module (umbrales §17).
# Adaptadores, puertos, wiring de módulos e infraestructura se analizan pero no cuentan para coverage.
sonar.coverage.exclusions=apps/api/src/main.ts,apps/api/src/modules/**/adapters/**,apps/api/src/modules/**/ports/**,apps/api/src/modules/**/*.module.ts,apps/api/src/shared/infra/**
