version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
