version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: npm
    directory: /packages/config
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: npm
    directory: /packages/contracts
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]
