name: SonarCloud
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  analyze:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check SonarCloud token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured. Skipping SonarCloud analysis."
            echo "::warning::Create the SONAR_TOKEN repository secret and disable Automatic Analysis in SonarCloud. See README for steps."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.sonar-token.outputs.has_token == 'true'
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sonar-token.outputs.has_token == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.sonar-token.outputs.has_token == 'true'
        env:
          HUSKY: 0
      - run: pnpm test
        if: steps.sonar-token.outputs.has_token == 'true'
      - name: SonarCloud Scan
        if: steps.sonar-token.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
