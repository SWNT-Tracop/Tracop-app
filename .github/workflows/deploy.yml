name: Deploy main to AWS demo

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_SSH_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Prepare tested deployment script
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "DEPLOY_SCRIPT=$(base64 -w0 scripts/deploy/aws-demo.sh)" >> "$GITHUB_ENV"
      - name: Deploy tested main commit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PUBLIC_URL: ${{ vars.API_BASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          envs: DEPLOY_SHA,PUBLIC_URL,DEPLOY_SCRIPT
          script: |
            set -eu
            printf '%s' "$DEPLOY_SCRIPT" | base64 --decode | sudo -n env DEPLOY_SHA="$DEPLOY_SHA" PUBLIC_URL="$PUBLIC_URL" bash -s
