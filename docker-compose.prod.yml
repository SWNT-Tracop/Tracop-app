# Producción: API + worker + PostgreSQL + Caddy (TLS automático).
# La imagen se publica en GHCR y llega por `docker compose pull`.
#
# Requiere:
#   - .env (600, fuera del repo) con los secretos de producción: DATABASE_URL (rol tracop_app),
#     MIGRATION_DATABASE_URL (rol tracop_owner), DB_OWNER_PASSWORD, DB_APP_PASSWORD y
#     DB_SUPERUSER_PASSWORD.
#   - ./Caddyfile con el dominio real.
name: tracop-prod

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      TRACOP_DOMAIN: ${TRACOP_DOMAIN:?TRACOP_DOMAIN must be the public API domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/swnt-tracop/tracop-api:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3000'
      NODE_ENV: production
      APP_PROFILE: production
      TRUST_PROXY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: ghcr.io/swnt-tracop/tracop-api:${VERSION:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      APP_PROFILE: production
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/swnt-tracop/tracop-api:${VERSION:-latest}
    restart: 'no'
    # Roles and passwords first (superuser), then the migrations (owner). Both steps are
    # idempotent, so the deploy script can run this service on every release.
    command: ['sh', '-c', 'node dist/scripts/provision-db-roles.js && node dist/drizzle/migrate.js']
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${DB_SUPERUSER:-postgres}
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD}
      PGDATABASE: tracop
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?DB_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: tracop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d tracop']
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin puerto publicado: solo accesible desde la red de Compose.

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_SUPERUSER:-postgres}
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD}
      PGDATABASE: tracop
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ./backups:/backups
    command: ['sh', '/scripts/backup-loop.sh']
    depends_on:
      - db

  # Second copy off the server: the dumps above go to a private bucket with a 30-day lifecycle
  # rule. The credentials can only write there (s3:PutObject); the restore test runs from your
  # machine with the backups read from that bucket.
  backup-upload:
    image: amazon/aws-cli:2.31.7
    restart: unless-stopped
    entrypoint: ['sh', '/scripts/s3-upload-loop.sh']
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BACKUP_S3_URI: ${BACKUP_S3_URI:?BACKUP_S3_URI is required, for example s3://tracop-backups-xxxx/prod}
      UPLOAD_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ./backups:/backups:ro
    depends_on:
      - backup

volumes:
  pgdata:
  caddy-data:
  caddy-config:
