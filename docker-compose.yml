services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracop
      POSTGRES_PASSWORD: tracop
      POSTGRES_DB: tracop
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracop -d tracop']
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
