# TRACOP demo para AWS: datos sintéticos, almacenamiento en AWS S3 (sin MinIO).
# A diferencia de docker-compose.demo.yml, aquí NO hay contenedor MinIO: la API habla
# con S3 real vía S3_* y S3_FORCE_PATH_STYLE=false (estilo virtual-hosted).
#
# Requisitos previos:
#   - Bucket S3 creado y credenciales IAM de mínimo privilegio (permisos en .env.example).
#   - .env.demo generado (POSTGRES_*, JWT_SECRET, OTP_HMAC_SECRET, RATE_LIMIT_HMAC_SECRET,
#     METRICS_TOKEN) más las variables S3_* que se pasan por entorno.
name: tracop-aws

x-app: &app
  image: tracop-api:aws
  build: { context: ., dockerfile: Dockerfile }
  env_file: .env.demo
  environment: &app-env
    NODE_ENV: development
    APP_PROFILE: demo
    OTP_SENDER: ${OTP_SENDER:-console}
    TELEGRAM_MODE: webhook
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    S3_BUCKET: ${S3_BUCKET}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:-}
    S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:-}
    S3_POLICY_ACCESS_KEY: ${S3_POLICY_ACCESS_KEY:-}
    S3_POLICY_SECRET_KEY: ${S3_POLICY_SECRET_KEY:-}
    S3_FORCE_PATH_STYLE: 'false'
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?genera .env.demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?genera .env.demo}
      POSTGRES_DB: ${POSTGRES_DB:?genera .env.demo}
    volumes:
      - aws-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  setup:
    <<: *app
    command: sh -c "node dist/drizzle/migrate.js && node dist/drizzle/seed.js"
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: ['node', 'dist/main.js']
    environment:
      <<: *app-env
      PORT: '3000'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - '${DEMO_BIND:-0.0.0.0}:${DEMO_API_PORT:-3100}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      setup: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    depends_on:
      setup: { condition: service_completed_successfully }

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ./backups:/backups
    command: ['sh', '/scripts/backup-loop.sh']
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  aws-postgres:
